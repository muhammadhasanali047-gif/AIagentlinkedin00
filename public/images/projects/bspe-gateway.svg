<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0b1633"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Glowing background orb -->
  <circle cx="620" cy="180" r="160" fill="#0072ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="320" r="140" fill="#00f0ff" opacity="0.1" filter="url(#glow)"/>

  <!-- Window Container -->
  <rect x="60" y="50" width="680" height="380" rx="16" fill="#0a1226" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Bar -->
  <rect x="60" y="50" width="680" height="44" rx="16" fill="#0f172a" fill-opacity="0.9"/>
  <circle cx="88" cy="72" r="5" fill="#ef4444"/>
  <circle cx="106" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="124" cy="72" r="5" fill="#10b981"/>
  <text x="156" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">BSPE :: Enterprise WhatsApp Gateway &amp; Telemetry</text>
  <rect x="630" y="62" width="90" height="20" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="642" cy="72" r="3" fill="#00f0ff"/>
  <text x="652" y="76" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">LIVE ACTIVE</text>

  <!-- Left Sidebar / Stats -->
  <rect x="80" y="114" width="220" height="294" rx="12" fill="#070d1e" stroke="#1e293b" stroke-width="1"/>
  <text x="100" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SYSTEM METRICS</text>
  
  <rect x="100" y="165" width="180" height="54" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="114" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Throughput</text>
  <text x="114" y="206" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">99.98% Uptime</text>

  <rect x="100" y="231" width="180" height="54" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="114" y="251" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Webhook Latency</text>
  <text x="114" y="272" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">&lt; 140 ms</text>

  <rect x="100" y="297" width="180" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="114" y="320" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Architecture Stack</text>
  <text x="114" y="342" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NestJS • TypeScript</text>
  <text x="114" y="362" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Docker • OpenAPI • Redis</text>

  <!-- Right Panel: Message Stream & Webhook Pipeline -->
  <rect x="320" y="114" width="400" height="294" rx="12" fill="#070d1e" stroke="#1e293b" stroke-width="1"/>
  <text x="340" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">EVENT DISPATCH PIPELINE</text>

  <!-- Message 1 -->
  <rect x="340" y="165" width="360" height="58" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="362" cy="194" r="10" fill="#25d366" fill-opacity="0.2"/>
  <text x="357" y="198" fill="#25d366" font-family="system-ui, sans-serif" font-size="11" font-weight="700">W</text>
  <text x="384" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">POST /v1/webhooks/whatsapp/inbound</text>
  <text x="384" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Customer Inquiry: &quot;Need automated quote integration&quot;</text>

  <!-- Message 2 -->
  <rect x="340" y="235" width="360" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="362" cy="264" r="10" fill="#0284c7" fill-opacity="0.2"/>
  <text x="358" y="268" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AI</text>
  <text x="384" y="256" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AGENT INFERENCE :: Intent Classified</text>
  <text x="384" y="276" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Contextual reply generated + CRM lead staged</text>

  <!-- Message 3 -->
  <rect x="340" y="305" width="360" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="362" cy="334" r="10" fill="#10b981" fill-opacity="0.2"/>
  <text x="357" y="338" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">OK</text>
  <text x="384" y="326" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HTTP 200 SUCCESS :: Dispatched in 118ms</text>
  <text x="384" y="346" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Client acknowledged • Multi-session synchronized</text>
</svg>
