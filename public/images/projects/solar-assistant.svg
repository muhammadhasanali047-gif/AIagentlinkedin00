  <text x="117" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ Alp Solar AI Estimate</text>
  <text x="117" y="235" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Recommended: 10kW On-Grid System</text>
