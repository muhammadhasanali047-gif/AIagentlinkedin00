  <text x="450" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">98.4% Tariff Match</text>

  <rect x="435" y="235" width="265" height="60" rx="8" fill="#0f1f3d" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Lead Conversion Lift</text>
  <text x="450" y="280" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="700">3.8x Faster Close</text>

  <rect x="435" y="305" width="265" height="82" rx="8" fill="#0f1f3d" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="328" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Integration Ecosystem</text>
  <text x="450" y="350" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WhatsApp Cloud API • Node.js</text>
  <text x="450" y="370" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dynamic PDF Engine • CRM Dispatch</text>
